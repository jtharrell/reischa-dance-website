name: Deploy Astro site to GitHub Pages

# Manual trigger only for now, while the Astro rebuild lives alongside the
# current live site (see SITE_REFRESH_PLAN.md). Switch the `on:` trigger to
# `push: branches: [main]` at Phase 5 cutover, once the repo's Pages source
# is switched from "Deploy from a branch" to "GitHub Actions" in
# Settings > Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro-site

      - name: Build
        run: npm run build
        working-directory: astro-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
